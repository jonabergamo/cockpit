<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <g id="icon">
    <g id="bg">
      <rect x="50" y="50" width="412" height="412" rx="92" fill="#151a22"/>
    </g>

    <!-- strip 1: working (cobalt), long, flush left -->
    <g id="strip-working">
      <rect x="114" y="134" width="52" height="64" rx="14" fill="#6f93f5"/>
      <rect x="176" y="134" width="222" height="64" rx="14" fill="#232a35"/>
      <rect x="198" y="157" width="104" height="18" rx="9" fill="#dce2ea"/>
    </g>

    <!-- strip 2: waiting (amber), pushed right like a strip slid out of the bay -->
    <g id="strip-waiting">
      <rect x="150" y="224" width="52" height="64" rx="14" fill="#e0a93a"/>
      <rect x="212" y="224" width="186" height="64" rx="14" fill="#232a35"/>
      <rect x="234" y="247" width="66" height="18" rx="9" fill="#dce2ea"/>
    </g>

    <!-- strip 3: idle (muted), shortest -->
    <g id="strip-idle">
      <rect x="114" y="314" width="52" height="64" rx="14" fill="#8c96a6"/>
      <rect x="176" y="314" width="150" height="64" rx="14" fill="#1c222c"/>
    </g>
  </g>
</svg>
