<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <g id="icon">
    <g id="bg">
      <rect x="50" y="50" width="412" height="412" rx="92" fill="#151a22"/>
    </g>

    <!-- scope surface -->
    <circle cx="256" cy="256" r="146" fill="#1c222c"/>

    <!-- sweep wedge: 12 o'clock to 2 o'clock -->
