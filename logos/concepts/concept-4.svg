    <!-- single inner ring -->
    <circle cx="256" cy="256" r="58" fill="none" stroke="#151a22" stroke-width="24"/>

    <!-- centre hub -->
    <circle cx="256" cy="256" r="14" fill="#dce2ea"/>

    <!-- blips (sessions) -->
    <circle cx="316" cy="170" r="20" fill="#dce2ea"/>
    <circle cx="174" cy="304" r="22" fill="#e0a93a"/>
    <circle cx="306" cy="343" r="18" fill="#8aa8ff"/>
  </g>
</svg>
